<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paris Explorer - QR Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-12">

    <div id="app" class="max-w-md mx-auto min-h-screen p-6 flex flex-col justify-center items-center">
        <!-- Contenu injecté dynamiquement -->
    </div>

    <script>
        // --- LOGIQUE DE GESTION ---
        let teamCode = localStorage.getItem('pe_team_code') || '';
        
        function genererCodeEtQR() {
            // Génère un code unique
            const code = 'GRP-' + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('pe_team_code', code);
            teamCode = code;
            
            // Note : Pour un déploiement réel, vous utiliseriez une API 
            // pour générer une image QR code pointant vers cette URL avec le code en paramètre.
            alert("Code généré : " + code + "\nTransmettez ce code aux 4 autres membres de votre groupe.");
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!teamCode) {
                app.innerHTML = `
                    <div class="text-center space-y-6">
                        <h1 class="text-3xl font-black text-amber-400">PARIS EXPLORATEUR</h1>
                        <div class="p-6 bg-slate-800 rounded-3xl border border-slate-700">
                            <p class="mb-4 text-sm font-bold">Leader de groupe ?</p>
                            <button onclick="genererCodeEtQR()" class="w-full py-4 bg-amber-500 rounded-xl font-black text-slate-950 uppercase">Scanner QR / Créer Groupe</button>
                            
                            <div class="my-6 border-t border-slate-700"></div>
                            
                            <p class="mb-4 text-sm font-bold">Membre de groupe ?</p>
                            <input id="joinCode" placeholder="Entrer le code du leader" class="w-full p-3 mb-2 rounded-lg bg-slate-900 border border-slate-700 text-center uppercase font-mono">
                            <button onclick="rejoindreGroupe()" class="w-full py-3 bg-slate-700 rounded-xl font-bold uppercase text-xs">Rejoindre</button>
                        </div>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="text-center space-y-4">
                        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Code de votre groupe</h2>
                        <div class="text-4xl font-black text-amber-400 tracking-tighter">${teamCode}</div>
                        <p class="text-xs text-slate-500">Montrez ce code à vos équipiers (Max 5 personnes)</p>
                        <button onclick="localStorage.clear(); location.reload();" class="text-[10px] text-red-400 underline">Réinitialiser</button>
                    </div>
                `;
            }
        }

        function rejoindreGroupe() {
            const code = document.getElementById('joinCode').value.toUpperCase();
            if(code.startsWith('GRP-')) {
                localStorage.setItem('pe_team_code', code);
                teamCode = code;
                render();
            } else {
                alert("Code invalide");
            }
        }

        render();
    </script>
</body>
</html>
