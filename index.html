        function gererPhoto(e, id) {
            const file = e.target.files[0];
            if (!file) return;

            // Attribution immédiate des points sans conserver l'image
            if (!progress[id]) progress[id] = { points: 0 };
            
            if (!progress[id].photoPrise) {
                progress[id].photoPrise = true;
                progress[id].points = (progress[id].points || 0) + 2;

                saveState();
