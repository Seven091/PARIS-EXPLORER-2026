<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paris Explorer - La Quête des Gardiens</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 select-none overflow-x-hidden font-sans pb-12">

    <div id="app" class="max-w-md mx-auto min-h-screen relative flex flex-col justify-center items-center p-6">
        <div class="text-amber-400 font-bold animate-pulse text-center">
            Chargement de l'application en cours... 🗼
        </div>
    </div>

    <script>
        // Système de stockage local sécurisé pour la synchronisation par code d'équipe
        let storage = {
            getItem(key) {
                try { return localStorage.getItem(key); } catch(e) { return null; }
            },
            setItem(key, val) {
                try { localStorage.setItem(key, val); } catch(e) {}
            },
            removeItem(key) {
                try { localStorage.removeItem(key); } catch(e) {}
            }
        };

        const ENIGMES = [
            {
                id: '1',
                titre: 'Étape 1 : Le Quartier Moderne',
                lieuSecret: 'Centre Pompidou / Quartier de l\'Horloge',
                tempsEstimeMinutes: 15,
                devinette: 'Je suis célèbre pour mes tuyaux colorés et ma structure inversée où l\'acier et les gaines techniques habillent ma façade. À côté de moi, un automate musical s\'anime régulièrement. Qui suis-je ?',
                questionZone: 'Dans quel quartier piétonnier et animé du 4e arrondissement, connu pour son plateau aux couleurs primaires, dois-je me rendre pour le trouver ?',
                motsCles: ['pompidou', 'centre pompidou', 'beaubourg', 'centrepompidou'],
                motsClesZone: ['beaubourg', 'horloge', '4e', 'quatrieme', 'plateau'],
                anecdote: 'Inauguré en 1977, ce centre culturel avant-gardiste a été conçu par Renzo Piano et Richard Rogers.',
                defiPhoto: 'Prendre une photo de groupe en imitant la structure métallique ou les couleurs vives du bâtiment.'
            },
            {
                id: '2',
                titre: 'Étape 2 : L\'Ancien Palais des Rois',
                lieuSecret: 'Musée du Louvre & Pyramide',
                tempsEstimeMinutes: 20,
                devinette: 'Je garde le sourire depuis des siècles derrière ma vitre blindée. J\'habite dans un immense palais fortifié qui fut la demeure des rois de France avant de devenir le plus grand musée du monde. Qui suis-je ?',
                questionZone: 'Quel célèbre monument de verre moderne marque l\'entrée principale de ce palais royal situé au bord de la Seine ?',
                motsCles: ['louvre', 'joconde', 'mona lisa', 'musee du louvre'],
                motsClesZone: ['pyramide', 'cour napoleon', 'rivoli'],
                anecdote: 'La pyramide de verre du Louvre a été conçue par l\'architecte I. M. Pei et inaugurée en 1989.',
                defiPhoto: 'Prendre un selfie avec la pose ou le sourire le plus mystérieux possible.'
            },
            {
                id: '3',
                titre: 'Étape 3 : Le Pont des Amoureux',
                lieuSecret: 'Pont des Arts',
                tempsEstimeMinutes: 15,
                devinette: 'Je suis une passerelle piétonne entièrement réservée aux promeneurs, reliant l\'Institut de France au Musée du Louvre avec une vue imprenable sur la Seine. Qui suis-je ?',
                questionZone: 'Quel quai de la rive gauche permet d\'accéder directement à cette passerelle piétonne ?',
                motsCles: ['pont des arts', 'passerelle'],
                motsClesZone: ['quai de conti', 'institut de france', 'conti'],
                anecdote: 'C\'est le tout premier pont métallique parisien, construit au début du XIXe siècle.',
                defiPhoto: 'Faire semblant de porter tout le pont sur vos épaules ou de marcher sur un fil invisible.'
            },
            {
                id: '4',
                titre: 'Étape 4 : Les Gardiens de Pierre',
                lieuSecret: 'Notre-Dame de Paris (Parvis)',
                tempsEstimeMinutes: 25,
                devinette: 'Je domine le cœur historique de la capitale depuis des siècles avec mon architecture gothique, mes rosaces monumentales et mes gargouilles protectrices. Qui suis-je ?',
                questionZone: 'Sur quelle île naturelle de la Seine, berceau historique de Paris, dois-je poser mes pas ?',
                motsCles: ['notre dame', 'notre-dame', 'cathedrale notre dame', 'notredame'],
                motsClesZone: ['ile de la cite', 'cite', 'parvis'],
                anecdote: 'Le roman de Victor Hugo publié en 1831 a largement contribué à sauver l\'édifice de la ruine.',
                defiPhoto: 'Imiter une gargouille effrayante ou protectrice en faisant une grimace.'
            },
            {
                id: '5',
                titre: 'Étape 5 : Le Jardin de la Reine',
                lieuSecret: 'Jardin du Luxembourg',
                tempsEstimeMinutes: 25,
                devinette: 'Je suis un vaste espace vert au cœur de la rive gauche, célèbre pour son grand bassin octogonal où les enfants font voguer des voiliers en bois depuis des générations. Qui suis-je ?',
                questionZone: 'Quel grand boulevard de la rive gauche longe ce jardin historique créé par Marie de Médicis ?',
                motsCles: ['luxembourg', 'jardin du luxembourg', 'palais du luxembourg'],
                motsClesZone: ['saint michel', 'boulevard saint michel', 'medicis', 'senat'],
                anecdote: 'Ce jardin a été créé en 1612 à la demande de Marie de Médicis pour accompagner son palais.',
                defiPhoto: 'Faire une photo de groupe en mode course de bateaux au bord du bassin.'
            },
            {
                id: '6',
                titre: 'Étape 6 : Le Géant de Fer',
                lieuSecret: 'Champ de Mars / Tour Eiffel',
                tempsEstimeMinutes: 30,
                devinette: 'Érigée pour une exposition universelle internationale, j\'ai longtemps été la structure la plus haute du monde grâce à ma dentelle de fer forgé. Qui suis-je ?',
                questionZone: 'Sur quel vaste espace vert s\'étend le pied de cette grande dame de fer ?',
                motsCles: ['tour eiffel', 'eiffel', 'la tour eiffel'],
                motsClesZone: ['champ de mars', 'mars', 'pont d iena'],
                anecdote: 'Gustave Eiffel disposait d\'un petit bureau secret aménagé tout en haut de la structure.',
                defiPhoto: 'Faire la célèbre illusion d\'optique où l\'on tient le sommet de la tour entre ses doigts.'
            },
            {
                id: '7',
                titre: 'Étape 7 : Le Bouquet Final',
                lieuSecret: 'Place du Trocadéro',
                tempsEstimeMinutes: 15,
                devinette: 'Située sur une colline face à la Seine, je offre l\'une des perspectives panoramiques les plus spectaculaires et photographiées de la capitale. Qui suis-je ?',
                questionZone: 'Quel célèbre palais abritant des musées se dresse sur cette esplanade panoramique ?',
                motsCles: ['trocadero', 'trocadéro', 'palais de chaillot'],
                motsClesZone: ['chaillot', 'palais de chaillot', 'esplanade'],
                anecdote: 'C\'est l\'endroit idéal pour admirer les illuminations de la Dame de Fer à la tombée de la nuit.',
                defiPhoto: 'Sauter en l\'air ensemble en criant victoire avec la Tour Eiffel en arrière-plan.'
            }
        ];

        let teamCode = storage.getItem('pe_team_code') || '';
        let progress = {};
        let currentStepIndex = 0;
        let stepTimers = {};

        function loadTeamState() {
            try {
                if (teamCode) {
                    const rawProgress = storage.getItem(`pe_quest_progress_${teamCode}`);
                    progress = rawProgress ? JSON.parse(rawProgress) : {};
                    
                    const rawTimers = storage.getItem(`pe_quest_timers_${teamCode}`);
                    stepTimers = rawTimers ? JSON.parse(rawTimers) : {};
                }
            } catch(e) {
                progress = {};
                stepTimers = {};
            }
        }

        function saveState() {
            if (teamCode) {
                storage.setItem('pe_team_code', teamCode);
                storage.setItem(`pe_quest_progress_${teamCode}`, JSON.stringify(progress));
                storage.setItem(`pe_quest_timers_${teamCode}`, JSON.stringify(stepTimers));
            }
        }

        function getTotalScore() {
            return Object.values(progress).reduce((acc, curr) => acc + (curr.points || 0), 0);
        }

        function updateCurrentStepIndex() {
            for (let i = 0; i < ENIGMES.length; i++) {
                const p = progress[ENIGMES[i].id] || {};
                if (!p.etapeCompletee) {
                    currentStepIndex = i;
                    initTimerForStep(ENIGMES[i].id, ENIGMES[i].tempsEstimeMinutes);
                    return;
                }
            }
            currentStepIndex = ENIGMES.length - 1;
        }

        function initTimerForStep(stepId, durationMinutes) {
            if (!stepTimers[stepId]) {
                const totalMs = (durationMinutes + 5) * 60 * 1000;
                stepTimers[stepId] = {
                    deadline: Date.now() + totalMs
                };
                saveState();
            }
        }

        function render() {
            loadTeamState();
            updateCurrentStepIndex();

            const app = document.getElementById('app');
            if (!app) return;

            // Écran de connexion / code d'équipe pour synchroniser le groupe
            if (!teamCode) {
                app.className = "flex flex-col min-h-screen p-6 justify-center items-center max-w-md mx-auto";
                app.innerHTML = `
                    <div class="text-center mb-8">
                        <span class="text-6xl">✨</span>
                        <h1 class="text-3xl font-black mt-3 text-amber-400 tracking-tight">PARIS EXPLORATEUR</h1>
                        <p class="text-amber-200/80 text-xs mt-1 font-bold tracking-widest uppercase">Synchronisation d'équipe par code</p>
                    </div>

                    <div class="w-full bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6">
                        <div>
                            <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 mb-3">1. Créer une nouvelle équipe</h2>
                            <button onclick="createTeam()" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-sm transition-all shadow-lg uppercase">
                                + Générer un code d'équipe
                            </button>
                        </div>

                        <div class="relative flex py-1 items-center">
                            <div class="flex-grow border-t border-slate-700"></div>
                            <span class="flex-shrink mx-4 text-xs font-bold text-slate-500 uppercase">OU</span>
                            <div class="flex-grow border-t border-slate-700"></div>
                        </div>

                        <div class="space-y-3">
                            <h2 class="text-xs font-black uppercase tracking-wider text-slate-400">2. Rejoindre une équipe existante</h2>
                            <input id="inputCode" type="text" placeholder="Entrer le code (ex: TEAM-4821)" class="w-full py-3 px-4 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-400 text-center font-mono font-bold tracking-widest uppercase" />
                            <button onclick="joinTeam()" class="w-full py-3.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-sm transition-all uppercase">
                                Rejoindre l'équipe
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            app.className = "max-w-md mx-auto min-h-screen relative flex flex-col";
            
            let html = `
                <header class="bg-slate-800 pt-8 pb-6 px-6 rounded-b-[2.5rem] border-b border-slate-700/80 shadow-xl relative text-center">
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-black tracking-widest px-3 py-1 rounded-full uppercase">
                            🛡️ Code Équipe : ${teamCode}
                        </span>
                        <button onclick="leaveTeam()" class="text-slate-400 hover:text-white text-xs font-bold underline">
                            Changer
                        </button>
                    </div>

                    <h1 class="text-4xl font-black text-amber-400 my-1">
                        🏆 ${getTotalScore()} <span class="text-lg font-bold text-white">PTS</span>
                    </h1>
                    <p class="text-slate-400 text-xs font-medium">Synchronisation globale active</p>
                </header>

                <main class="flex-1 px-4 py-6 space-y-6">
            `;

            if (currentStepIndex >= ENIGMES.length - 1 && progress[ENIGMES[ENIGMES.length - 1].id]?.etapeCompletee) {
                html += `
                    <div class="bg-slate-800/90 border border-amber-500 p-6 rounded-3xl text-center space-y-4 shadow-2xl">
                        <span class="text-5xl">🎉</span>
                        <h2 class="text-2xl font-black text-amber-400">Quête Terminée !</h2>
                        <p class="text-xs text-slate-300 leading-relaxed">Félicitations à votre équipe synchronisée ! Vous avez résolu toutes les énigmes de Paris.</p>
                        <div class="text-xl font-bold text-white">Score final : ${getTotalScore()} points</div>
                    </div>
                `;
            } else {
                const item = ENIGMES[currentStepIndex];
                const p = progress[item.id] || {};
                const isAnswered = p.reponseSoumise === true;
                const timerData = stepTimers[item.id] || { deadline: Date.now() + 100000 };
                
                const timeLeftMs = timerData.deadline - Date.now();
                const timeLeftMin = Math.max(0, Math.ceil(timeLeftMs / 60000));

                html += `
                    <article class="p-5 rounded-3xl border bg-slate-800/90 border-amber-500/40 shadow-lg space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black text-amber-400 tracking-wider uppercase">${item.titre}</span>
                            <span class="bg-slate-900 border border-slate-700 text-amber-300 font-black text-xs px-2.5 py-1 rounded-xl">${p.points || 0} pts</span>
                        </div>

                        <!-- Gestion de la fenêtre de trajet (+ 5 min après arrivée) -->
                        <div class="flex items-center justify-between bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-700/50 text-[11px]">
                            <span class="text-slate-400">⏳ Fenêtre de trajet :</span>
                            <span class="font-bold text-amber-300">${timeLeftMin > 0 ? timeLeftMin + ' min restantes' : 'Temps réglementaire dépassé (étape accessible)'}</span>
                        </div>

                        <!-- Questions distinctes : Objet/Monument et Zone cible -->
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/50 space-y-3">
                            <div>
                                <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider mb-1">1. Devinette de l'objet ou monument</div>
                                <p class="text-slate-200 text-xs leading-relaxed italic">« ${item.devinette} »</p>
                            </div>
                            <div class="pt-2 border-t border-slate-800">
                                <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider mb-1">2. Question pour localiser la zone cible</div>
                                <p class="text-slate-300 text-xs leading-relaxed">« ${item.questionZone} »</p>
                            </div>
                        </div>
                `;

                if (!isAnswered) {
                    html += `
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Réponse (Objet / Monument)</label>
                                <input id="input_objet_${item.id}" type="text" placeholder="Ex: Tour Eiffel..." value="${p.saisieObjet || ''}" class="w-full text-xs p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Réponse (Zone / Localisation)</label>
                                <input id="input_zone_${item.id}" type="text" placeholder="Ex: Champ de Mars..." value="${p.saisieZone || ''}" class="w-full text-xs p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
                            </div>

                            <div class="flex gap-2 pt-1">
                                <button onclick="validerReponse('${item.id}')" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider shadow-md">
                                    ✓ Soumettre la réponse
                                </button>
                                <button onclick="utiliserJoker('${item.id}')" class="px-3.5 py-3 bg-slate-700 hover:bg-slate-600 text-amber-300 font-bold rounded-xl text-xs uppercase tracking-wider" title="Joker Photo">
                                    📸 Joker
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    if (p.reponseCorrecte) {
                        html += `
                            <div class="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs">
                                <span class="font-bold text-emerald-400">Succès ! Zone exacte débloquée : <span class="text-white">${item.lieuSecret}</span> (+6 pts)</span>
                            </div>
                        `;
                    } else if (p.jokerUtilise) {
                        html += `
                            <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs space-y-1">
                                <span class="font-bold text-amber-400">Joker Photo activé (+2 pts)</span>
                                <div class="text-slate-300">Zone exacte débloquée : <span class="text-white font-bold">${item.lieuSecret}</span></div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs space-y-1">
                                <span class="font-bold text-rose-400 block">Réponses non validées (0 pt)</span>
                                <span class="text-slate-400 text-[10px]">Vous pouvez tout de même valider le défi photo pour continuer.</span>
                            </div>
                        `;
                    }

                    // Section Histoire & Défi Photo + Bouton de finalisation pour passer à l'étape suivante
                    html += `
                        <div class="space-y-4 pt-2 border-t border-slate-700/60">
                            <div class="bg-slate-900/50 p-3.5 rounded-2xl border border-slate-700/50 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-bold text-amber-300 uppercase">📜 Histoire & Anecdote</span>
                                    ${!p.anecdoteLue ? `<button onclick="validerAnecdote('${item.id}')" class="text-[10px] bg-amber-500 text-slate-950 px-2.5 py-1 rounded-lg font-black uppercase">Lire (+3 pts)</button>` : `<span class="text-[10px] text-emerald-400 font-bold">Lue ✓</span>`}
                                </div>
                                <p class="text-xs text-slate-300 leading-relaxed">${item.anecdote}</p>
                            </div>

                            <div class="bg-slate-900/50 p-3.5 rounded-2xl border border-slate-700/50 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-bold text-amber-300 uppercase">📸 Défi Photo requis</span>
                                    ${p.photoPrise ? `<span class="text-[10px] text-emerald-400 font-bold">Validé ✓ (+2 pts)</span>` : ''}
                                </div>
                                <p class="text-xs text-slate-300 font-medium italic">${item.defiPhoto}</p>
                                <input type="file" accept="image/*" capture="environment" onchange="gererPhoto(event, '${item.id}')" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-amber-400 hover:file:bg-slate-700 cursor-pointer" />
                                ${p.photoData ? `<div class="rounded-xl overflow-hidden max-h-48 border border-slate-700 mt-2"><img src="${p.photoData}" class="w-full h-full object-cover" /></div>` : ''}
                            </div>

                            <!-- BOUTON DE VALIDATION ET PASSAGE DIRECT À L'ÉTAPE SUIVANTE -->
                            <button onclick="finaliserEtPasserEtape('${item.id}')" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider shadow-lg transition-all">
                                🚀 Valider l'étape et passer à la suivante
                            </button>
                        </div>
                    `;
                }

                html += `</article>`;
            }

            html += `</main>`;
            app.innerHTML = html;
        }

        function createTeam() {
            teamCode = 'TEAM-' + Math.floor(1000 + Math.random() * 9000);
            progress = {};
            stepTimers = {};
            saveState();
            render();
        }

        function joinTeam() {
            const input = document.getElementById('inputCode');
            if (!input || !input.value.trim()) return;
            teamCode = input.value.trim().toUpperCase();
            loadTeamState();
            render();
        }

        function leaveTeam() {
            if (confirm("Quitter ou changer d'équipe ?")) {
                storage.removeItem('pe_team_code');
                teamCode = '';
                progress = {};
                stepTimers = {};
                render();
            }
        }

        function validerReponse(id) {
            const inputObj = document.getElementById(`input_objet_${id}`);
            const inputZon = document.getElementById(`input_zone_${id}`);
            if (!inputObj || !inputZon) return;

            const textObj = inputObj.value.trim().toLowerCase();
            const textZon = inputZon.value.trim().toLowerCase();
            if (!textObj && !textZon) return;

            const item = ENIGMES.find(e => e.id === id);
            const isObjCorrect = item.motsCles.some(mot => textObj.includes(mot));
            const isZonCorrect = item.motsClesZone.some(mot => textZon.includes(mot));
            const isCorrect = isObjCorrect && isZonCorrect;

            if (!progress[id]) progress[id] = { points: 0 };
            progress[id].saisieObjet = inputObj.value;
            progress[id].saisieZone = inputZon.value;
            progress[id].reponseSoumise = true;
            progress[id].reponseCorrecte = isCorrect;
            progress[id].jokerUtilise = false;

            if (isCorrect) {
                progress[id].points = (progress[id].points || 0) + 6;
            }

            saveState();
            render();
        }

        function utiliserJoker(id) {
            if (!progress[id]) progress[id] = { points: 0 };
            progress[id].reponseSoumise = true;
            progress[id].reponseCorrecte = false;
            progress[id].jokerUtilise = true;
            progress[id].saisieObjet = "Joker Photo activé";
            progress[id].saisieZone = "Joker Photo activé";
            progress[id].points = (progress[id].points || 0) + 2;

            saveState();
            render();
        }

        function validerAnecdote(id) {
            if (progress[id].anecdoteLue) return;
            progress[id].anecdoteLue = true;
            progress[id].points = (progress[id].points || 0) + 3;
            saveState();
            render();
        }

        function gererPhoto(e, id) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                if (!progress[id]) progress[id] = { points: 0 };
                const isNew = !progress[id].photoPrise;
                progress[id].photoData = reader.result;
                
                if (isNew) {
                    progress[id].photoPrise = true;
                    progress[id].points = (progress[id].points || 0) + 2;
                }

                saveState();
                render();
            };
            reader.readAsDataURL(file);
        }

        // Action explicite pour valider l'étape et passer immédiatement à la suivante
        function finaliserEtPasserEtape(id) {
            if (!progress[id]) progress[id] = {};
            progress[id].etapeCompletee = true;
            saveState();
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                loadTeamState();
                render();
            } catch(err) {
                document.getElementById('app').innerHTML = `<div class="text-red-400 p-4 text-center text-xs">Erreur de chargement : ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
